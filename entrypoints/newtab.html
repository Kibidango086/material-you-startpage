<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Startpage</title>
  <!-- 标签页图标：与网站一致的山+太阳徽标（主题色系） -->
  <link rel="icon" type="image/png" href="/icons/icon-32.png" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #141218;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
  <script type="module">
    // 接收站点广播的动态 favicon（跟随网页实际图标与主题色），
    // 实时更新本页（标签页）图标，保持与网页完全一致。
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (
        data &&
        typeof data === 'object' &&
        data.source === 'my-startpage' &&
        typeof data.favicon === 'string' &&
        data.favicon.startsWith('data:image/svg+xml')
      ) {
        const link =
          document.querySelector('link[rel="icon"]') ??
          (() => {
            const l = document.createElement('link');
            l.rel = 'icon';
            document.head.appendChild(l);
            return l;
          })();
        link.href = data.favicon;
      }
    });
  </script>
</head>
<body>
  <!-- 全屏嵌入站点：地址栏保持干净，搜索/设置/壁纸等全部功能照常工作 -->
  <iframe src="https://mystartup.kibidango.top/" title="My Startpage"></iframe>
</body>
</html>
