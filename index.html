<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 防闪白：在 CSS/JS 加载前根据系统主题预置背景色 -->
    <script>
      (function () {
        try {
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var stored = localStorage.getItem('material-you-startpage:v3');
          if (stored) {
            try {
              var s = JSON.parse(stored);
              var theme = s && s.appearance && s.appearance.theme;
              if (theme === 'dark') dark = true;
              else if (theme === 'light') dark = false;
            } catch (e) {}
          }
          var bg = dark ? '#141218' : '#fef7ff';
          document.documentElement.style.backgroundColor = bg;
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          // 记住初始值，供后续 JS 读取
          document.documentElement.dataset.initTheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>My Startpage — Material You 起始页</title>
    <meta
      name="description"
      content="My Startpage：Material You 风格的个人浏览器起始页。多引擎搜索、常用链接、自定义背景、一言，清爽无广告。"
    />
    <meta name="theme-color" content="#6750a4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1b20" media="(prefers-color-scheme: dark)" />
    <meta name="author" content="Kibidango086" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / 分享预览 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="My Startpage — Material You 起始页" />
    <meta
      property="og:description"
      content="Material You 风格的个人浏览器起始页：多引擎搜索、常用链接、自定义背景、一言。"
    />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="My Startpage" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="My Startpage — Material You 起始页" />
    <meta
      name="twitter:description"
      content="Material You 风格的个人浏览器起始页：多引擎搜索、常用链接、自定义背景、一言。"
    />

    <!-- Favicon（内联 SVG 兜底，运行时随配色动态更新） -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%236750a4'/%3E%3Ctext x='50' y='72' font-family='Roboto,Arial,sans-serif' font-size='58' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E"
    />

    <!-- Google Fonts: Roboto + Noto Sans SC（非阻塞加载，先用系统字体渲染） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

    <!-- Material Icons Round 字体（ligature 图标） -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
